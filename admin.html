<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private inbox · LA</title><style>*{box-sizing:border-box}body{margin:0;background:#0c090e;color:#f4eef6;font:15px/1.6 Arial,sans-serif}.wrap{width:min(850px,92%);margin:65px auto}h1{font:normal 2.5rem Georgia,serif}input,button{font:inherit;padding:12px;border-radius:9px}input{width:100%;background:#17111c;color:#fff;border:1px solid #765e81}button{background:#b198c4;color:#150d18;border:0;cursor:pointer;font-weight:700}form{display:grid;gap:12px;max-width:390px}.message{padding:18px;border:1px solid #765e81;border-radius:12px;margin:12px 0;background:#17111c;overflow-wrap:anywhere}.muted{color:#c7b9cc;font-size:.8rem}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#d6b7ec}pre{white-space:pre-wrap;font:inherit}#inbox[hidden],#login[hidden]{display:none}</style></head><body><main class="wrap"><div class="top"><h1>Private inbox</h1><a href="./">← Portfolio</a></div><p class="muted">Owner-only area. Sign in with your Supabase admin account. This page is not a public message feed.</p><section id="login"><form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="inbox" hidden><button id="logout">Sign out</button><h2>Messages</h2><div id="messages"></div></section><p id="status" role="status"></p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_ANON_KEY}from'./site-config.js';const status=document.getElementById('status');if(!SUPABASE_URL||!SUPABASE_ANON_KEY){status.textContent='Private inbox not configured. Follow SETUP_PRIVATE_INBOX.md.'}else{const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY),login=document.getElementById('login'),inbox=document.getElementById('inbox'),list=document.getElementById('messages');async function render(){const{data:{user}}=await db.auth.getUser();login.hidden=!!user;inbox.hidden=!user;if(!user)return;const{data,error}=await db.from('portfolio_messages').select('sender_name,sender_email,project,message,created_at').order('created_at',{ascending:false}).limit(200);list.replaceChildren();if(error){status.textContent='Access denied or inbox unavailable. Check owner account and database policies.';return}status.textContent=data.length+' message(s)';for(const m of data){const card=document.createElement('article');card.className='message';const h=document.createElement('strong');h.textContent=m.sender_name+' · '+m.sender_email;const time=document.createElement('div');time.className='muted';time.textContent=new Date(m.created_at).toLocaleString()+(m.project?' · '+m.project:'');const body=document.createElement('pre');body.textContent=m.message;card.append(h,time,body);list.append(card)}}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();status.textContent='Signing in…';const{error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){status.textContent='Sign-in failed.';return}status.textContent='';await render()};document.getElementById('logout').onclick=async()=>{await db.auth.signOut();list.replaceChildren();status.textContent='Signed out.';await render()};render()}</script></body></html>
