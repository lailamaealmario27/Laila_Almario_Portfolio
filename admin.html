<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private inbox · LA</title><style>*{box-sizing:border-box}body{margin:0;background:#0c090e;color:#f4eef6;font:15px/1.6 Arial,sans-serif}.wrap{width:min(850px,92%);margin:65px auto}h1{font:normal 2.5rem Georgia,serif}input,button{font:inherit;padding:12px;border-radius:9px}input{width:100%;background:#17111c;color:#fff;border:1px solid #765e81}button{background:#b198c4;color:#150d18;border:0;cursor:pointer;font-weight:700}form{display:grid;gap:12px;max-width:390px}.message{padding:18px;border:1px solid #765e81;border-radius:12px;margin:12px 0;background:#17111c;overflow-wrap:anywhere}.muted{color:#c7b9cc;font-size:.8rem}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#d6b7ec}pre{white-space:pre-wrap;font:inherit}#inbox[hidden],#login[hidden],#reset[hidden]{display:none}</style></head><body><main class="wrap"><div class="top"><h1>Private inbox</h1><a href="./">← Portfolio</a></div><p class="muted">Owner-only area. Sign in with your Supabase admin account. This page is not a public message feed.</p><section id="login"><form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button>Sign in</button></form><button type="button" id="forgot" style="margin-top:12px;background:transparent;color:#d6b7ec;border:1px solid #765e81">Forgot password?</button></section><section id="reset" hidden><h2>Set a new password</h2><form id="resetForm"><label>New password<input type="password" id="newPassword" required minlength="12" autocomplete="new-password"></label><label>Confirm new password<input type="password" id="confirmPassword" required minlength="12" autocomplete="new-password"></label><button type="submit">Save new password</button></form></section><section id="inbox" hidden><button id="logout">Sign out</button><h2>Messages</h2><div id="messages"></div></section><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './site-config.js';
const status=document.getElementById('status'),login=document.getElementById('login'),inbox=document.getElementById('inbox'),reset=document.getElementById('reset'),list=document.getElementById('messages');
if(!SUPABASE_URL||!SUPABASE_ANON_KEY){status.textContent='Private inbox not configured. Follow SETUP_PRIVATE_INBOX.md.'}
else {
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let recovery=false;
const url=new URL(location.href);
if(url.searchParams.has('error')){status.textContent='This recovery link is invalid or expired. Request a new password-reset email below.';history.replaceState(null,'',location.pathname);}
function showReset(){recovery=true;login.hidden=true;inbox.hidden=true;reset.hidden=false;status.textContent='Enter your new password.';}
async function render(){if(recovery)return;const {data:{user},error:userError}=await db.auth.getUser();login.hidden=!!user;inbox.hidden=!user;reset.hidden=true;if(!user){if(userError)status.textContent='Please sign in.';return;}const {data,error}=await db.from('portfolio_messages').select('sender_name,sender_email,project,message,created_at').order('created_at',{ascending:false}).limit(200);list.replaceChildren();if(error){status.textContent='Access denied or inbox unavailable. Check owner account and database policies.';return;}status.textContent=data.length+' message(s)';for(const m of data){const card=document.createElement('article');card.className='message';const h=document.createElement('strong');h.textContent=m.sender_name+' · '+m.sender_email;const time=document.createElement('div');time.className='muted';time.textContent=new Date(m.created_at).toLocaleString()+(m.project?' · '+m.project:'');const body=document.createElement('pre');body.textContent=m.message;card.append(h,time,body);list.append(card);}}
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showReset();else if(event==='SIGNED_OUT'){recovery=false;reset.hidden=true;login.hidden=false;inbox.hidden=true;list.replaceChildren();}});
// Supabase may initialize a recovery session before this page finishes loading.
const hash=new URLSearchParams(location.hash.slice(1));
if(hash.get('type')==='recovery')showReset();
if(url.searchParams.get('type')==='recovery'&&url.searchParams.has('code'))showReset();
document.getElementById('forgot').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){status.textContent='Enter your email address above first.';return;}status.textContent='Sending reset email…';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:new URL('./admin.html',location.href).href});status.textContent=error?'Could not send reset email. Please try again later.':'If this email belongs to an account, a password-reset link has been sent. Use the newest email.';};
document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const password=document.getElementById('newPassword').value,confirm=document.getElementById('confirmPassword').value;if(password!==confirm){status.textContent='Passwords do not match.';return;}status.textContent='Saving password…';const {error}=await db.auth.updateUser({password});if(error){status.textContent='Password update failed. Request a fresh reset link and try again.';return;}await db.auth.signOut();recovery=false;reset.hidden=true;login.hidden=false;inbox.hidden=true;document.getElementById('password').value='';document.getElementById('resetForm').reset();history.replaceState(null,'',location.pathname);status.textContent='Password updated. Sign in with your new password.';};
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();status.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){status.textContent='Sign-in failed. Check your email and password.';return;}status.textContent='';await render();};
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();status.textContent='Signed out.';};
if(!recovery)render();
}
</script></body></html>
